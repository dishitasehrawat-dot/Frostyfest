<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Frosty Fest</title>
    <style>
        /* DESIGN SECTION: Colors, Fonts, and Animations */
        @import url('https://script.google.com/macros/s/AKfycbw1X32bbL2HqZYApBq0sfFcQBYfcbla5Sb4Q0U0ZV4fvwFu3dInsIwR4VUPrYkpPcqi/exec');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
        }

        .snowflake {
            position: absolute;
            top: -10px;
            color: #fff;
            animation: fall linear infinite;
        }
        @keyframes fall { to { transform: translateY(100vh); } }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
        }

        h1 { color: #87CEFA; margin-bottom: 10px; }
        h2 { font-weight: 300; margin-bottom: 20px; }
        
        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: #87CEFA;
            color: #000;
            border: none;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }
        button:hover { background-color: #fff; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }

        .hidden { display: none; }
        .error { color: #ff6b6b; margin-top: 15px; font-weight: 600; font-size: 0.9em; }

        .pop-in { animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <div id="snow-container"></div>

    <!-- Screen 1: Ask for Email -->
    <div id="form-screen" class="card pop-in">
        <h1>❄️ The Frosty Fest</h1>
        <p>Welcome! Please identify yourself.</p>
        <input type="email" id="email" placeholder="Enter your registered email">
        <button id="verify-btn" onclick="startVerification()">VERIFY ENTRY</button>
        <p id="status-msg" class="error"></p>
    </div>

    <!-- Screen 2: Checking Location -->
    <div id="loc-screen" class="card hidden">
        <h1 style="font-size: 3rem;">🛰️</h1>
        <h2>Verifying Location...</h2>
        <p>Email confirmed. Now checking if you are at the event.</p>
    </div>

    <!-- Screen 3: Success -->
    <div id="welcome-screen" class="card hidden pop-in">
        <h1 style="font-size: 4rem;">🎉</h1>
        <h2 style="color: #87CEFA; font-weight: bold;">Welcome to The Frosty Fest</h2>
        <p>Your entry has been approved.</p>
    </div>

    <!-- Screen 4: Location Error -->
    <div id="loc-error-screen" class="card hidden">
        <h1 style="font-size: 4rem;">🚫</h1>
        <h2>Access Denied</h2>
        <p style="color: #ff6b6b;">You can only access it while in The Frosty Fest.</p>
        <button onclick="location.reload()" style="margin-top:20px;">Try Again</button>
    </div>

    <script>
        // ============================================
        // YOUR SETTINGS (YOU MUST EDIT THESE 3 LINES)
        // ============================================
        
        // 1. Paste the URL you got from Google Apps Script here:
        const GOOGLE_SCRIPT_URL = "PASTE_YOUR_LONG_GOOGLE_URL_HERE"; 
        
        // 2. The Latitude of your event:
        const TARGET_LAT = 28.55884; 

        // 3. The Longitude of your event:
        const TARGET_LNG = 77.05751; 

        // ============================================
        // END OF SETTINGS - DO NOT TOUCH BELOW
        // ============================================

        const MAX_RADIUS_KM = 1; // 1000 meters

        const formScreen = document.getElementById('form-screen');
        const locScreen = document.getElementById('loc-screen');
        const welcomeScreen = document.getElementById('welcome-screen');
        const locErrorScreen = document.getElementById('loc-error-screen');
        const statusMsg = document.getElementById('status-msg');
        const verifyBtn = document.getElementById('verify-btn');

        // Check Local Storage (Device Lock)
        if (localStorage.getItem('frosty_pass') === 'true') {
            showSection(welcomeScreen);
        }

        function showSection(section) {
            [formScreen, locScreen, welcomeScreen, locErrorScreen].forEach(el => el.classList.add('hidden'));
            section.classList.remove('hidden');
        }

        function startVerification() {
            const emailInput = document.getElementById('email').value.trim();
            
            if (!emailInput) {
                statusMsg.innerText = "Please enter an email.";
                return;
            }

            verifyBtn.disabled = true;
            verifyBtn.innerText = "Checking Database...";
            statusMsg.innerText = "";

            // Use GET request (Fixes connection error)
            const finalUrl = GOOGLE_SCRIPT_URL + "?email=" + encodeURIComponent(emailInput);

            fetch(finalUrl)
                .then(response => response.json())
                .then(data => {
                    if (data.result === 'success') {
                        checkLocation();
                    } else {
                        statusMsg.innerText = "Oops email not found";
                        verifyBtn.disabled = false;
                        verifyBtn.innerText = "VERIFY ENTRY";
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    statusMsg.innerText = "Connection Error. Check URL.";
                    verifyBtn.disabled = false;
                    verifyBtn.innerText = "VERIFY ENTRY";
                });
        }

        function checkLocation() {
            showSection(locScreen);

            if (!navigator.geolocation) {
                alert("Geolocation not supported.");
                showSection(locErrorScreen);
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const dist = getDistInKm(
                        position.coords.latitude,
                        position.coords.longitude,
                        TARGET_LAT,
                        TARGET_LNG
                    );

                    if (dist <= MAX_RADIUS_KM) {
                        localStorage.setItem('frosty_pass', 'true'); 
                        showSection(welcomeScreen);
                    } else {
                        showSection(locErrorScreen);
                    }
                },
                (err) => {
                    showSection(locErrorScreen);
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        function getDistInKm(lat1, lon1, lat2, lon2) {
            var R = 6371; 
            var dLat = deg2rad(lat2-lat1);
            var dLon = deg2rad(lon2-lon1); 
            var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * 
                    Math.sin(dLon/2) * Math.sin(dLon/2); 
            var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
            return R * c;
        }
        function deg2rad(deg) { return deg * (Math.PI/180); }

        function createSnow() {
            const container = document.getElementById('snow-container');
            if(!container) return;
            for(let i=0; i<50; i++){
                const snow = document.createElement('div');
                snow.innerHTML = '❄';
                snow.className = 'snowflake';
                snow.style.left = Math.random() * 100 + 'vw';
                snow.style.animationDuration = (Math.random() * 3 + 2) + 's';
                snow.style.opacity = Math.random();
                container.appendChild(snow);
            }
        }
        createSnow();
    </script>
</body>
</html>
